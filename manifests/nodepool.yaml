apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: pdb-lab
spec:
  template:
    metadata:
      labels:
        lab.example.com/placement: pdb
    spec:
      nodeClassRef:
        group: karpenter.k8s.aws
        kind: EC2NodeClass
        name: pdb-lab
      taints:
        - key: lab.example.com/experiment
          value: pdb
          effect: NoSchedule
      expireAfter: Never
      requirements:
        - key: node.kubernetes.io/instance-type
          operator: In
          values: [m5.large, m5a.large]
        - key: karpenter.sh/capacity-type
          operator: In
          values: [on-demand]
        - key: kubernetes.io/arch
          operator: In
          values: [amd64]
        - key: kubernetes.io/os
          operator: In
          values: [linux]
  limits:
    cpu: "2"
  disruption:
    consolidationPolicy: WhenEmptyOrUnderutilized
    consolidateAfter: 30s
    budgets:
      - nodes: "0"
