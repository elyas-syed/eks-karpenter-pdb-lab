<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="440" viewBox="0 0 1240 440" role="img" aria-labelledby="title desc" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"><title id="title">Four gates for Karpenter consolidation</title><desc id="desc">An underutilized node is consolidated only if its pods can be evicted under their PDBs, the NodePool disruption budget allows another disruption, the pods fit elsewhere, and deleting or replacing the node saves money. Failing any gate keeps the node running.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#232F3E"/></marker><marker id="arrow-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#D13212"/></marker><marker id="arrow-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1D8102"/></marker></defs><rect width="1240" height="440" fill="#FFFFFF"/><rect x="20" y="60" width="160" height="150" rx="8" fill="#F4F6F6" stroke="#545B64" stroke-width="1.8"/><text x="36" y="93" font-size="13.5" font-weight="700" fill="#232F3E" text-anchor="start">Candidate</text><text x="36" y="122" font-size="12.5" font-weight="400" fill="#232F3E" text-anchor="start">Node is underutilized</text><text x="36" y="140" font-size="12.5" font-weight="400" fill="#232F3E" text-anchor="start">for consolidateAfter</text><text x="36" y="158" font-size="12.5" font-weight="400" fill="#232F3E" text-anchor="start">(30 s in this lab).</text><rect x="214" y="60" width="176" height="150" rx="8" fill="#F1F7FD" stroke="#2E73B8" stroke-width="1.8"/><circle cx="240" cy="88" r="13" fill="#2E73B8"/><text x="240" y="93" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text><text x="262" y="93" font-size="13.5" font-weight="700" fill="#232F3E" text-anchor="start">Pod budget</text><text x="230" y="122" font-size="12.5" font-weight="400" fill="#232F3E" text-anchor="start">Can every pod on</text><text x="230" y="140" font-size="12.5" font-weight="400" fill="#232F3E" text-anchor="start">the node be evicted</text><text x="230" y="158" font-size="12.5" font-weight="400" fill="#232F3E" text-anchor="start">right now?</text><text x="230" y="196" font-size="11.5" font-weight="600" fill="#2E73B8" text-anchor="start">Kubernetes Eviction API</text><rect x="418" y="60" width="176" height="150" rx="8" fill="#F1F7FD" stroke="#2E73B8" stroke-width="1.8"/><circle cx="444" cy="88" r="13" fill="#2E73B8"/><text x="444" y="93" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text><text x="466" y="93" font-size="13.5" font-weight="700" fill="#232F3E" text-anchor="start">NodePool budget</text><text x="434" y="122" font-size="12.5" font-weight="400" fill="#232F3E" text-anchor="start">May Karpenter</text><text x="434" y="140" font-size="12.5" font-weight="400" fill="#232F3E" text-anchor="start">disrupt one more</text><text x="434" y="158" font-size="12.5" font-weight="400" fill="#232F3E" text-anchor="start">node right now?</text><text x="434" y="196" font-size="11.5" font-weight="600" fill="#2E73B8" text-anchor="start">Karpenter</text><rect x="622" y="60" width="176" height="150" rx="8" fill="#F1F7FD" stroke="#2E73B8" stroke-width="1.8"/><circle cx="648" cy="88" r="13" fill="#2E73B8"/><text x="648" y="93" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text><text x="670" y="93" font-size="13.5" font-weight="700" fill="#232F3E" text-anchor="start">Scheduling</text><text x="638" y="122" font-size="12.5" font-weight="400" fill="#232F3E" text-anchor="start">Do the pods fit on</text><text x="638" y="140" font-size="12.5" font-weight="400" fill="#232F3E" text-anchor="start">other nodes (requests,</text><text x="638" y="158" font-size="12.5" font-weight="400" fill="#232F3E" text-anchor="start">spread, taints, volumes)?</text><text x="638" y="196" font-size="11.5" font-weight="600" fill="#2E73B8" text-anchor="start">Karpenter simulation</text><rect x="826" y="60" width="176" height="150" rx="8" fill="#F1F7FD" stroke="#2E73B8" stroke-width="1.8"/><circle cx="852" cy="88" r="13" fill="#2E73B8"/><text x="852" y="93" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text><text x="874" y="93" font-size="13.5" font-weight="700" fill="#232F3E" text-anchor="start">Price</text><text x="842" y="122" font-size="12.5" font-weight="400" fill="#232F3E" text-anchor="start">Delete, or replace</text><text x="842" y="140" font-size="12.5" font-weight="400" fill="#232F3E" text-anchor="start">with a cheaper</text><text x="842" y="158" font-size="12.5" font-weight="400" fill="#232F3E" text-anchor="start">instance?</text><text x="842" y="196" font-size="11.5" font-weight="600" fill="#2E73B8" text-anchor="start">Karpenter</text><rect x="1036" y="60" width="184" height="150" rx="8" fill="#F2F8F0" stroke="#1D8102" stroke-width="1.8"/><text x="1052" y="93" font-size="13.5" font-weight="700" fill="#232F3E" text-anchor="start">Consolidated</text><text x="1052" y="122" font-size="12.5" font-weight="400" fill="#232F3E" text-anchor="start">Node drained and</text><text x="1052" y="140" font-size="12.5" font-weight="400" fill="#232F3E" text-anchor="start">terminated. EC2</text><text x="1052" y="158" font-size="12.5" font-weight="400" fill="#232F3E" text-anchor="start">billing stops.</text><path d="M182,135.0 H211" fill="none" stroke="#1D8102" stroke-width="1.8" marker-end="url(#arrow-ok)"/><path d="M392,135.0 H415" fill="none" stroke="#1D8102" stroke-width="1.8" marker-end="url(#arrow-ok)"/><path d="M596,135.0 H619" fill="none" stroke="#1D8102" stroke-width="1.8" marker-end="url(#arrow-ok)"/><path d="M800,135.0 H823" fill="none" stroke="#1D8102" stroke-width="1.8" marker-end="url(#arrow-ok)"/><path d="M1004,135.0 H1033" fill="none" stroke="#1D8102" stroke-width="1.8" marker-end="url(#arrow-ok)"/><text x="404" y="127.0" font-size="11" font-weight="700" fill="#1D8102" text-anchor="middle">yes</text><text x="608" y="127.0" font-size="11" font-weight="700" fill="#1D8102" text-anchor="middle">yes</text><text x="812" y="127.0" font-size="11" font-weight="700" fill="#1D8102" text-anchor="middle">yes</text><text x="1016" y="127.0" font-size="11" font-weight="700" fill="#1D8102" text-anchor="middle">yes</text><path d="M302,212 V286" fill="none" stroke="#D13212" stroke-width="1.8" marker-end="url(#arrow-bad)"/><text x="310" y="246" font-size="11" font-weight="700" fill="#D13212" text-anchor="start">no</text><path d="M506,212 V286" fill="none" stroke="#D13212" stroke-width="1.8" marker-end="url(#arrow-bad)"/><text x="514" y="246" font-size="11" font-weight="700" fill="#D13212" text-anchor="start">no</text><path d="M710,212 V286" fill="none" stroke="#D13212" stroke-width="1.8" marker-end="url(#arrow-bad)"/><text x="718" y="246" font-size="11" font-weight="700" fill="#D13212" text-anchor="start">no</text><path d="M914,212 V286" fill="none" stroke="#D13212" stroke-width="1.8" marker-end="url(#arrow-bad)"/><text x="922" y="246" font-size="11" font-weight="700" fill="#D13212" text-anchor="start">no</text><rect x="214" y="290" width="788" height="64" rx="8" fill="#FDF2F1" stroke="#D13212" stroke-width="1.8"/><text x="608" y="317" font-size="15" font-weight="700" fill="#D13212" text-anchor="middle">Node stays and EC2 keeps billing</text><text x="608" y="338" font-size="12.5" font-weight="400" fill="#232F3E" text-anchor="middle">Check DisruptionBlocked events, PDB status, NodePool budgets and Karpenter controller logs.</text><text x="20" y="32" font-size="17" font-weight="700" fill="#232F3E" text-anchor="start">Four gates every voluntary consolidation must pass</text><text x="20" y="400" font-size="12.5" font-weight="400" fill="#545B64" text-anchor="start">Simplified view: Karpenter evaluates these together, and any one of them can block a consolidation.</text><text x="20" y="420" font-size="12.5" font-weight="400" fill="#545B64" text-anchor="start">Forceful disruption (expiration, interruption) is not rate-limited by NodePool budgets.</text></svg>
