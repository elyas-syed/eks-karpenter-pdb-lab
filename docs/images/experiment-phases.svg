<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="470" viewBox="0 0 1240 470" role="img" aria-labelledby="title desc" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"><title id="title">Three experiment phases</title><desc id="desc">Phase 1 uses a PDB with minAvailable 100 percent and a NodePool budget of one: Karpenter is blocked. Phase 2 allows one eviction but sets the NodePool budget to zero: the node is held. Phase 3 allows both: Karpenter deletes the underutilized node with no failed requests.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#232F3E"/></marker><marker id="arrow-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#D13212"/></marker><marker id="arrow-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1D8102"/></marker></defs><rect width="1240" height="470" fill="#FFFFFF"/><text x="20" y="32" font-size="17" font-weight="700" fill="#232F3E" text-anchor="start">One variable at a time: three phases on the same node</text><rect x="20" y="56" width="372" height="396" rx="10" fill="#FFFFFF" stroke="#D5DBDB" stroke-width="1.4"/><path d="M20,66 A10,10 0 0 1 30,56 H382 A10,10 0 0 1 392,66 V112 H20 Z" fill="#D13212"/><text x="38" y="79" font-size="11.5" font-weight="700" fill="#FFFFFF" text-anchor="start">PHASE 1</text><text x="38" y="100" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="start">Restrictive PDB</text><text x="38" y="147" font-size="13" font-weight="500" fill="#232F3E" text-anchor="start">PDB allowed disruptions</text><rect x="318" y="130" width="56" height="26" rx="13" fill="#D13212" stroke="#D13212" stroke-width="1"/><text x="346" y="148" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">0</text><text x="38" y="183" font-size="13" font-weight="500" fill="#232F3E" text-anchor="start">NodePool budget (nodes)</text><rect x="318" y="166" width="56" height="26" rx="13" fill="#1D8102" stroke="#1D8102" stroke-width="1"/><text x="346" y="184" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text><rect x="38" y="208" width="336" height="56" rx="6" fill="#F7F8F8" stroke="#D5DBDB" stroke-width="1"/><text x="50" y="231" font-size="12.5" font-weight="500" fill="#232F3E" text-anchor="start" font-family="'SF Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace">minAvailable: 100%</text><text x="50" y="251" font-size="12.5" font-weight="500" fill="#232F3E" text-anchor="start" font-family="'SF Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace">budgets: nodes: "1"</text><rect x="38" y="282" width="336" height="150" rx="8" fill="#FDF2F1" stroke="#D13212" stroke-width="1.6"/><circle cx="66" cy="312" r="16" fill="#D13212"/><text x="66" y="318" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">✕</text><text x="92" y="318" font-size="17" font-weight="700" fill="#D13212" text-anchor="start">Blocked</text><text x="54" y="358" font-size="12.5" font-weight="400" fill="#232F3E" text-anchor="start">Karpenter emits DisruptionBlocked</text><text x="54" y="378" font-size="12.5" font-weight="400" fill="#232F3E" text-anchor="start">naming pdb-lab/demo. A dry-run</text><text x="54" y="398" font-size="12.5" font-weight="400" fill="#232F3E" text-anchor="start">eviction gets 429 TooManyRequests.</text><rect x="434" y="56" width="372" height="396" rx="10" fill="#FFFFFF" stroke="#D5DBDB" stroke-width="1.4"/><path d="M434,66 A10,10 0 0 1 444,56 H796 A10,10 0 0 1 806,66 V112 H434 Z" fill="#B7791F"/><text x="452" y="79" font-size="11.5" font-weight="700" fill="#FFFFFF" text-anchor="start">PHASE 2</text><text x="452" y="100" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="start">NodePool budget at zero</text><text x="452" y="147" font-size="13" font-weight="500" fill="#232F3E" text-anchor="start">PDB allowed disruptions</text><rect x="732" y="130" width="56" height="26" rx="13" fill="#1D8102" stroke="#1D8102" stroke-width="1"/><text x="760" y="148" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text><text x="452" y="183" font-size="13" font-weight="500" fill="#232F3E" text-anchor="start">NodePool budget (nodes)</text><rect x="732" y="166" width="56" height="26" rx="13" fill="#D13212" stroke="#D13212" stroke-width="1"/><text x="760" y="184" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">0</text><rect x="452" y="208" width="336" height="56" rx="6" fill="#F7F8F8" stroke="#D5DBDB" stroke-width="1"/><text x="464" y="231" font-size="12.5" font-weight="500" fill="#232F3E" text-anchor="start" font-family="'SF Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace">maxUnavailable: 1</text><text x="464" y="251" font-size="12.5" font-weight="500" fill="#232F3E" text-anchor="start" font-family="'SF Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace">budgets: nodes: "0"</text><rect x="452" y="282" width="336" height="150" rx="8" fill="#FDF8EE" stroke="#B7791F" stroke-width="1.6"/><circle cx="480" cy="312" r="16" fill="#B7791F"/><text x="480" y="318" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">Ⅱ</text><text x="506" y="318" font-size="17" font-weight="700" fill="#B7791F" text-anchor="start">Held</text><text x="468" y="358" font-size="12.5" font-weight="400" fill="#232F3E" text-anchor="start">The PDB now admits an eviction,</text><text x="468" y="378" font-size="12.5" font-weight="400" fill="#232F3E" text-anchor="start">but the node stays untouched for</text><text x="468" y="398" font-size="12.5" font-weight="400" fill="#232F3E" text-anchor="start">the whole control window.</text><rect x="848" y="56" width="372" height="396" rx="10" fill="#FFFFFF" stroke="#D5DBDB" stroke-width="1.4"/><path d="M848,66 A10,10 0 0 1 858,56 H1210 A10,10 0 0 1 1220,66 V112 H848 Z" fill="#1D8102"/><text x="866" y="79" font-size="11.5" font-weight="700" fill="#FFFFFF" text-anchor="start">PHASE 3</text><text x="866" y="100" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="start">Both budgets open</text><text x="866" y="147" font-size="13" font-weight="500" fill="#232F3E" text-anchor="start">PDB allowed disruptions</text><rect x="1146" y="130" width="56" height="26" rx="13" fill="#1D8102" stroke="#1D8102" stroke-width="1"/><text x="1174" y="148" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text><text x="866" y="183" font-size="13" font-weight="500" fill="#232F3E" text-anchor="start">NodePool budget (nodes)</text><rect x="1146" y="166" width="56" height="26" rx="13" fill="#1D8102" stroke="#1D8102" stroke-width="1"/><text x="1174" y="184" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text><rect x="866" y="208" width="336" height="56" rx="6" fill="#F7F8F8" stroke="#D5DBDB" stroke-width="1"/><text x="878" y="231" font-size="12.5" font-weight="500" fill="#232F3E" text-anchor="start" font-family="'SF Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace">maxUnavailable: 1</text><text x="878" y="251" font-size="12.5" font-weight="500" fill="#232F3E" text-anchor="start" font-family="'SF Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace">budgets: nodes: "1"</text><rect x="866" y="282" width="336" height="150" rx="8" fill="#F2F8F0" stroke="#1D8102" stroke-width="1.6"/><circle cx="894" cy="312" r="16" fill="#1D8102"/><text x="894" y="318" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">✓</text><text x="920" y="318" font-size="17" font-weight="700" fill="#1D8102" text-anchor="start">Consolidated</text><text x="882" y="358" font-size="12.5" font-weight="400" fill="#232F3E" text-anchor="start">Underutilized delete, 0 replacements.</text><text x="882" y="378" font-size="12.5" font-weight="400" fill="#232F3E" text-anchor="start">3 Ready endpoints in all 15 samples.</text><text x="882" y="398" font-size="12.5" font-weight="400" fill="#232F3E" text-anchor="start">80 of 80 HTTP requests succeeded.</text><path d="M394,256 H432" fill="none" stroke="#232F3E" stroke-width="1.8" marker-end="url(#arrow)"/><text x="413" y="246" font-size="10.5" font-weight="600" fill="#545B64" text-anchor="middle">change</text><text x="413" y="278" font-size="10.5" font-weight="600" fill="#545B64" text-anchor="middle">one</text><path d="M808,256 H846" fill="none" stroke="#232F3E" stroke-width="1.8" marker-end="url(#arrow)"/><text x="827" y="246" font-size="10.5" font-weight="600" fill="#545B64" text-anchor="middle">change</text><text x="827" y="278" font-size="10.5" font-weight="600" fill="#545B64" text-anchor="middle">one</text></svg>
